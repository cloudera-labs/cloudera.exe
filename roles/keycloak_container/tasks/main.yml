# Look up system user and group IDs
- name: Get keycloak system user info
  ansible.builtin.getent:
    database: passwd
    key: "{{ keycloak_system_username }}"

- name: Set keycloak UID fact
  ansible.builtin.set_fact:
    keycloak_uid: "{{ ansible_facts.getent_passwd[keycloak_system_username][1] }}"

# Directory structure configuration

- name: Make directory for the service
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ keycloak_system_username }}"
    group: "{{ keycloak_system_groupname }}"
    mode: 0777
  loop:
    - "{{ service_root_dir }}"
    - "{{ service_root_dir }}/conf"
    - "{{ service_root_dir }}/data"

# Docker Compose configuration
- name: Copy keycloak docker-compose.yml file into place.
  ansible.builtin.template:
    src: docker-compose.keycloak.yml.j2
    dest: "{{ service_root_dir }}/docker-compose.yml"
  vars:
    keycloak_home_dir: "{{ service_root_dir }}"

- name: Create .env file for docker-compose
  ansible.builtin.copy:
    dest: "{{ service_root_dir }}/.env"
    owner: "{{ keycloak_system_username }}"
    group: "{{ keycloak_system_groupname }}"
    mode: 0640
    content: |
      KEYCLOAK_ADMIN={{ keycloak_admin_username }}
      KEYCLOAK_ADMIN_PASSWORD={{ keycloak_admin_password }}

# Systemd configuration
- name: Configure keycloak systemd service.
  ansible.builtin.template:
    src: "systemd_docker_compose_service.j2"
    dest: /etc/systemd/system/keycloak.service
  notify: Start Keycloak

# ...
